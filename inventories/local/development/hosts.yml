all:
  children:
    local:
      children:
        web:
          hosts:
            # ローカル検証用 VM。~/.ssh/config の Host エントリ名をそのまま使う
            # （HostName 127.0.0.1 / User ec2-user は ssh_config 側の定義が効く）。
            # ansible の ssh プラグインは `-o Port=22` を明示的に渡して ssh_config の
            # Port を上書きするため、ポートだけはインベントリ側で指定する。
            almalinux9-test:
              ansible_user: ec2-user
              ansible_port: 2222
