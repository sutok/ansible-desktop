# 新しい「顧客 × 環境」を追加するときの雛形。
# 使い方:
#   cp -r inventories/_template inventories/<顧客名>/<環境名>
#   その後、CUSTOMER / ホスト名 / IP を実際の値に置き換える。
all:
  children:
    CUSTOMER:            # ← 顧客名に置き換える（例: customer_b）
      children:
        web:
          hosts:
            # 命名規則: <顧客略称>-<環境略称>-<役割><連番>
            # xx-prd-web01:
            #   ansible_host: 192.0.2.10
        db:
          hosts:
            # xx-prd-db01:
            #   ansible_host: 192.0.2.20
