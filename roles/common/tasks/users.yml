---
- name: users.csv を読み込む
  community.general.read_csv:
    path: "{{ users_csv_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: users_csv

# ServerName 列（Delete 列の次）で、その行を適用するサーバーを限定する。
#   ・all            : 全サーバーが対象（大文字小文字は問わない）
#   ・サーバー名      : インベントリのホスト名（inventory_hostname）と一致するサーバーのみ
#   ・名前:名前:...   : コロン区切りで複数サーバーを指定
#   ・空欄            : どのサーバーにも適用しない（適用したい場合は必ず記入する）
# ここで絞り込んでから Delete 列で振り分けるため、アカウント作成だけでなく
# 削除・SFTP bind mount もすべて ServerName の指定に従う。
- name: ServerName 列でこのサーバー宛ての行に絞り、Delete 列で有効／無効に振り分ける
  ansible.builtin.set_fact:
    users_enabled: "{{ _rows | rejectattr('Delete', 'in', users_truthy) | list }}"
    users_disabled: "{{ _rows | selectattr('Delete', 'in', users_truthy) | list }}"
    users_rows_other_servers: >-
      {{ _all_rows | map(attribute='UserName') | list
         | difference(_rows | map(attribute='UserName') | list) }}
  vars:
    _all_rows: "{{ users_csv.list | rejectattr('UserName', 'eq', '') | list }}"
    _rows_json: >-
      [{% for r in _all_rows
            if (r.ServerName | default('') | trim | lower) == 'all'
            or inventory_hostname in ((r.ServerName | default('')).split(':')
                                       | map('trim') | select | list)
        %}{{ r | to_json }}{{ "," if not loop.last }}{% endfor %}]
    _rows: "{{ _rows_json | from_json }}"

- name: ServerName 列でこのサーバーの対象外になった行を表示する
  ansible.builtin.debug:
    msg: >-
      次のユーザーは ServerName 列がこのサーバー（{{ inventory_hostname }}）を
      指していないため処理しません（空欄も対象外。全サーバー対象は all）:
      {{ users_rows_other_servers | join(', ') }}
  when: users_rows_other_servers | length > 0

- name: 保護対象アカウントが Delete 対象に入っていないか検査
  ansible.builtin.assert:
    that:
      - _hit | length == 0
    fail_msg: "保護対象アカウントが Delete 列で指定されています: {{ _hit }}"
    quiet: true
  vars:
    _hit: "{{ users_disabled | map(attribute='UserName') | select('in', users_protected) | list }}"

- name: 追加グループを解決する
  ansible.builtin.set_fact:
    users_all_groups: "{{ _resolved | from_json | unique | difference(users_forbidden_groups) | list }}"
  vars:
    _raw: >-
      {{ users_enabled | map(attribute='AdditionalGroups') | map('trim') | select
         | join(',') | regex_replace('[;\s]*,[;\s]*', ',') | trim }}
    _names: "{{ _raw.split(',') | map('trim') | select | list }}"
    _resolved: >-
      [{% for g in _names %}"{{ users_group_map[g] | default(g, true) }}"{{ "," if not loop.last }}{% endfor %}]

- name: Ansible から付与できないグループを警告する
  ansible.builtin.debug:
    msg: >-
      次のユーザーは {{ users_forbidden_groups | join(' / ') }} への参加が CSV で指定されていますが、
      運用ルール上 Ansible からは付与しません。必要な場合はサーバー側で手動対応してください:
      {{ _need_manual | join(', ') }}
  vars:
    _need_manual: >-
      {{ users_enabled
         | selectattr('AdditionalGroups', 'search', '(?i)' ~ (users_forbidden_groups + users_group_map.keys() | list) | join('|'))
         | map(attribute='UserName') | list }}
  when: _need_manual | length > 0

- name: 追加グループを作成
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users_all_groups }}"
  when: users_create_missing_groups | bool

- name: 既存アカウント一覧を取得する
  ansible.builtin.getent:
    database: passwd

- name: 既存グループ一覧を取得する
  ansible.builtin.getent:
    database: group

- name: 既定グループが存在することを確認する
  ansible.builtin.assert:
    that:
      - _missing | length == 0
    fail_msg: >-
      users_default_groups に指定されたグループがサーバー上に存在しません: {{ _missing }}.
      GID を壊さないため Ansible では作成しない方針のため、サーバー側で作成してから再実行してください。
    quiet: true
  vars:
    _missing: "{{ users_default_groups | difference(ansible_facts.getent_group.keys() | list) }}"
  when: users_default_groups | length > 0

- name: Password 列が指定されていても無視することを通知する
  ansible.builtin.debug:
    msg: >-
      SSH はパスワード認証を使わない方針のため、users.csv の Password 列は適用しません
      （対象: {{ _has_pw | join(', ') }}）
  vars:
    _has_pw: "{{ users_enabled | selectattr('Password', 'ne', '') | map(attribute='UserName') | list }}"
  when: _has_pw | length > 0

- name: ユーザーを作成する（パスワード認証は無効）
  ansible.builtin.user:
    name: "{{ item.UserName }}"
    comment: "{{ _comment }}"
    # sftp と no_login が両方真の行は SFTP 専用とみなし、シェルを nologin にする
    shell: "{{ users_nologin_shell if _sftp_only | bool else users_shell }}"
    create_home: "{{ users_create_home }}"
    groups: "{{ (_groups | from_json + users_default_groups) | unique | difference(users_forbidden_groups) }}"
    append: true
    # シャドウをロック状態（!）にして作成し、公開鍵認証のみを許可する。
    # 既存アカウントにパスワードが設定済みでも password_lock で確実にロックする。
    password: '!'
    update_password: on_create
    password_lock: true
    expires: -1
    state: present
  loop: "{{ users_enabled }}"
  loop_control:
    label: "{{ item.UserName }}"
  vars:
    _sftp_only: >-
      {{ item.sftp | default('') in users_truthy and
         item.no_login | default('') in users_truthy }}
    _last: "{{ (item.LastName | lower).split(\"'\") | map('title') | join(\"'\") }}"
    _first: "{{ (item.FirstName | lower).split(\"'\") | map('title') | join(\"'\") }}"
    _comment: "{{ ([_last, _first] | select | join(' ') ~ ' ' ~ item.Description) | trim | replace(':', ' ') }}"
    _names: "{{ (item.AdditionalGroups | regex_replace('[;\\s]*,[;\\s]*', ',') | trim).split(',') | map('trim') | select | list }}"
    _groups: >-
      [{% for g in _names %}"{{ users_group_map[g] | default(g, true) }}"{{ "," if not loop.last }}{% endfor %}]

- name: 鍵の保管ディレクトリを実行機に用意する
  ansible.builtin.file:
    path: "{{ users_ssh_key_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true
  # --check でもディレクトリを作る。実行機側の作業でサーバーには影響しないうえ、
  # ここを skip すると後続の鍵生成が dry-run 時だけ失敗するため。
  check_mode: false
  when: users_generate_ssh_keys | bool

- name: 実行機にある鍵ファイルを列挙する
  ansible.builtin.find:
    paths: "{{ users_ssh_key_dir }}"
    file_type: file
  delegate_to: localhost
  become: false
  run_once: true
  # 読み取りのみ。--check でも実行しないと後続の判定ができない。
  check_mode: false
  register: users_ssh_key_files
  when: users_generate_ssh_keys | bool

- name: 鍵ペアが無いユーザー分を実行機で生成する
  community.crypto.openssh_keypair:
    path: "{{ users_ssh_key_dir }}/{{ item.UserName }}"
    type: "{{ users_ssh_key_type }}"
    comment: "{{ item.UserName }}"
    mode: '0600'
    # 万一ここまで来ても既存の鍵は作り直さない（配布済みの鍵を無効化しないため）
    regenerate: never
  delegate_to: localhost
  become: false
  run_once: true
  # --check でも実行機側に鍵を作る。サーバーへの変更ではなく、
  # 公開鍵が無いと後続の authorized_key が dry-run 時だけ失敗するため。
  check_mode: false
  loop: "{{ users_enabled }}"
  loop_control:
    label: "{{ item.UserName }}"
  vars:
    _existing: >-
      {{ users_ssh_key_files.files | default([]) | map(attribute='path')
         | map('basename') | list }}
  when:
    - users_generate_ssh_keys | bool
    # 秘密鍵と公開鍵が揃っている場合はモジュールを通さない。
    # regenerate: never でも comment の更新や mode の調整でファイルを書き換え、
    # changed を返してしまうため、既存の鍵には一切触らせない。
    # 片方だけ欠けている場合は生成させる（.pub が無いと authorized_key が失敗する）。
    - not (item.UserName in _existing and (item.UserName ~ '.pub') in _existing)

- name: 公開鍵を authorized_keys に配置する
  ansible.posix.authorized_key:
    user: "{{ item.UserName }}"
    key: "{{ lookup('file', users_ssh_key_dir + '/' + item.UserName + '.pub') }}"
    state: present
    exclusive: "{{ users_ssh_key_exclusive }}"
    manage_dir: true
  loop: "{{ users_enabled }}"
  loop_control:
    label: "{{ item.UserName }}"
  # --check では前段のユーザー作成が実際には行われないため、
  # まだ存在しないユーザーへの配置は dry-run 時のみスキップする
  when: not ansible_check_mode or item.UserName in ansible_facts.getent_passwd

# ---- SFTP chroot 用の bind mount --------------------------------------------
# users.csv の mount_point 列をコロン区切りの配列として扱い、1 パスにつき
# 1 つの bind mount を作る。
#   src  : 列に書かれたパスそのもの（KUSANAGI 側の実体）
#   dest : 先頭の /home/<users_mount_source_owner>/ を /home/<UserName>/ に置換したパス
# src と dest を入れ替えると実体側が空になって復旧できない。順序を変えないこと。
- name: mount_point 列からマウント定義を組み立てる
  ansible.builtin.set_fact:
    users_sftp: "{{ _json | from_json }}"
  vars:
    # sftp 列が真の行だけを対象にする。sftp を空欄に戻すと定義から外れ、
    # 後段の掃除タスクが既存の bind mount と fstab エントリを削除する。
    _rows: >-
      {{ users_enabled | selectattr('sftp', 'defined') | selectattr('sftp', 'in', users_truthy)
         | selectattr('mount_point', 'defined')
         | rejectattr('mount_point', 'match', '^\s*$') | list }}
    _json: >-
      [{% for u in _rows %}{"user": {{ u.UserName | to_json }}, "mounts":
      [{% for p in (u.mount_point | regex_replace(users_mount_point_separator, ';') | regex_replace('/{2,}', '/')).split(';') | map('trim') | select | list %}{"src": {{ p | to_json }},
      "dest": {{ p | regex_replace('^/home/' ~ users_mount_source_owner ~ '/', '/home/' ~ u.UserName ~ '/') | to_json }}}{{ "," if not loop.last }}{% endfor %}]}{{ "," if not loop.last }}{% endfor %}]

- name: マウント定義を検査する
  ansible.builtin.assert:
    that:
      - _bad_prefix | length == 0
      - _protected | length == 0
    fail_msg: >-
      mount_point の値が不正です。
      /home/{{ users_mount_source_owner }}/ で始まらないパス（置換後も src と同じになり
      自分自身を bind mount してしまう）: {{ _bad_prefix }} /
      保護対象アカウントへの指定（ホームを root 所有に変えてしまう）: {{ _protected }}
    quiet: true
  vars:
    _bad_prefix: >-
      {{ users_sftp | map(attribute='mounts') | flatten | map(attribute='src')
         | reject('match', '^/home/' ~ users_mount_source_owner ~ '/.+') | list }}
    _protected: "{{ users_sftp | map(attribute='user') | select('in', users_protected) | list }}"
  when: users_sftp | length > 0

- name: SFTP ユーザーのホームを chroot 用に root 所有へ変更する
  ansible.builtin.file:
    path: "/home/{{ item.user }}"
    state: directory
    owner: "{{ users_sftp_home_owner }}"
    group: "{{ users_sftp_home_group }}"
    mode: "{{ users_sftp_home_mode }}"
  loop: "{{ users_sftp }}"
  loop_control:
    label: "{{ item.user }}"
  # authorized_keys を配置したあとに実行する。recurse しないため .ssh は
  # ユーザー所有 0700 のまま残り、sshd の StrictModes を通る。
  # --check ではユーザー作成自体が行われないため、未作成のユーザーは対象外にする。
  when: not ansible_check_mode or item.user in ansible_facts.getent_passwd

- name: 公開元ディレクトリの状態を調べる
  ansible.builtin.stat:
    path: "{{ item.1.src }}"
  loop: "{{ users_sftp | subelements('mounts') }}"
  loop_control:
    label: "{{ item.1.src }}"
  register: users_sftp_src

- name: 公開元ディレクトリが存在するマウント定義だけを後続処理の対象にする
  ansible.builtin.set_fact:
    users_sftp_mounts: >-
      {{ users_sftp_src.results | selectattr('stat.exists')
         | map(attribute='item') | list }}
    users_sftp_missing: >-
      {{ users_sftp_src.results | rejectattr('stat.exists')
         | map(attribute='item.1.src') | list }}

# 公開元が無い bind mount はマウント先の作成・mount 実行・/etc/fstab 登録を
# すべてスキップする。実体は Ansible では作らない方針のため、サーバー側で
# 用意してから再実行すること。
- name: 公開元ディレクトリが無いマウント定義を警告する
  ansible.builtin.debug:
    msg: "{{ users_sftp_missing | map('regex_replace', '$', ': is not exists.') | join('\n') }}"
  when: users_sftp_missing | length > 0

- name: マウント先が既にマウント済みか調べる
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - "{{ item.1.dest }}"
  loop: "{{ users_sftp_mounts }}"
  loop_control:
    label: "{{ item.1.dest }}"
  register: users_sftp_mounted
  # 読み取りのみ。--check でも実行しないと後続の判定ができない。
  changed_when: false
  failed_when: false
  check_mode: false

- name: マウント先ディレクトリを root 所有で用意する
  ansible.builtin.file:
    path: "{{ item.item.1.dest }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ users_sftp_mounted.results }}"
  loop_control:
    label: "{{ item.item.1.dest }}"
  # マウント済みのパスに owner/mode を当てると実体側（0775 pa_admin:www）を
  # 壊すため、まだマウントされていないときだけ触る。
  when: item.rc | default(1) != 0

- name: bind mount を実行し /etc/fstab に登録する
  ansible.posix.mount:
    path: "{{ item.1.dest }}"
    src: "{{ item.1.src }}"
    fstype: none
    opts: "{{ users_sftp_mount_opts }}"
    state: "{{ users_sftp_mount_state }}"
  loop: "{{ users_sftp_mounts }}"
  loop_control:
    label: "{{ item.1.src }} -> {{ item.1.dest }}"

# ---- 不要になった bind mount の掃除 -----------------------------------------
# CSV の sftp を空欄にした／mount_point から消した／ユーザーを Delete にした場合、
# 対応する bind mount を解除して /etc/fstab からも削除する。誤爆を避けるため、
#   ・マウント元が /home/<users_mount_source_owner>/ 配下
#   ・マウント先が CSV に載っているユーザー（保護対象を除く）のホーム配下
# の fstab エントリだけを対象にし、users_sftp に定義が残っているものは残す。
# 必ずユーザー削除（userdel -r）より前に実行すること。マウントしたまま
# ホームを削除すると bind 先の実体まで消えてしまう。
- name: fstab に登録済みの bind mount を調べる
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --types
      - none
      - --noheadings
      - --output
      - SOURCE,TARGET
  register: users_sftp_fstab
  # 読み取りのみ。該当なしは rc=1 になるが異常ではない。
  changed_when: false
  failed_when: false
  check_mode: false

- name: 不要になった bind mount を洗い出す
  ansible.builtin.set_fact:
    users_sftp_stale: >-
      {{ users_sftp_fstab.stdout_lines | default([]) | map('split')
         | selectattr('0', 'match', '^/home/' ~ users_mount_source_owner ~ '/')
         | selectattr('1', 'match', _home_re)
         | map(attribute='1') | reject('in', _desired) | list }}
  vars:
    _users: >-
      {{ (users_enabled + users_disabled) | map(attribute='UserName')
         | difference(users_protected) | list }}
    _home_re: "^/home/({{ _users | join('|') }})/"
    _desired: "{{ users_sftp | map(attribute='mounts') | flatten | map(attribute='dest') | list }}"
  when: _users | length > 0

- name: 不要になった bind mount を解除し /etc/fstab から削除する
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: "{{ users_sftp_stale | default([]) }}"

# ---- 退役ユーザーの削除 -----------------------------------------------------
# 順序を変えないこと。
#   1. mount_point 由来の bind mount を解除する（そのユーザー自身のマウント先だけ）
#   2. userdel をオプション無しで実行する
- name: 削除対象ユーザーのマウント先を組み立てる
  ansible.builtin.set_fact:
    users_delete_mounts: "{{ _json | from_json }}"
  vars:
    _rows: >-
      {{ users_disabled | selectattr('sftp', 'defined') | selectattr('sftp', 'in', users_truthy)
         | selectattr('mount_point', 'defined')
         | rejectattr('mount_point', 'match', '^\s*$')
         | rejectattr('UserName', 'in', users_protected) | list }}
    # 解除するのは mount_point の値そのもの（src＝実体）ではなく、
    # そこから導いたマウント先（dest）。作成時と同じ置換規則を使う。
    # 置換後に /home/<UserName>/ 配下にならないパスは他人のマウント先か実体側なので
    # dests から外し、skipped に退避して警告するだけにする。
    _json: >-
      [{% for u in _rows %}
      {% set _dests = (u.mount_point | regex_replace(users_mount_point_separator, ';') | regex_replace('/{2,}', '/')).split(';')
         | map('trim') | select
         | map('regex_replace', '^/home/' ~ users_mount_source_owner ~ '/', '/home/' ~ u.UserName ~ '/') | list %}
      {% set _own = '^/home/' ~ (u.UserName | regex_escape) ~ '/' %}
      {"user": {{ u.UserName | to_json }},
      "dests": {{ _dests | select('match', _own) | list | to_json }},
      "skipped": {{ _dests | reject('match', _own) | list | to_json }}}{{ "," if not loop.last }}{% endfor %}]

- name: 自分のホーム配下に無いマウント先を警告する
  ansible.builtin.debug:
    msg: >-
      次のパスは /home/<UserName>/ 配下に解決できないため解除しません
      （他人のマウント先や公開元の実体を誤って外さないため）: {{ _skipped }}
  vars:
    _skipped: "{{ users_delete_mounts | map(attribute='skipped') | flatten | list }}"
  when: _skipped | length > 0

# state は absent ではなく unmounted。ansible.posix.mount の absent は
# /etc/fstab のエントリを消したときしか umount を実行しないため、手動マウント
# （fstab に無い）には効かない。fstab の掃除は前段の stale タスクが行う。
- name: 退役ユーザーの bind mount を解除する
  ansible.posix.mount:
    path: "{{ item.1 }}"
    state: unmounted
  loop: "{{ users_delete_mounts | subelements('dests') }}"
  loop_control:
    label: "{{ item.0.user }} -> {{ item.1 }}"
  # users_delete_mode は問わない。disable でも公開領域は切り離す。
  when: item.0.user in ansible_facts.getent_passwd

- name: ユーザーを削除する
  ansible.builtin.user:
    name: "{{ item.UserName }}"
    state: absent
    # remove / force とも false にすると userdel <name> がそのまま実行される。
    # -r を付けないためホームディレクトリとメールスプールは残す。
    remove: false
    force: false
  loop: "{{ users_disabled }}"
  loop_control:
    label: "{{ item.UserName }}"
  when:
    - users_delete_mode == 'remove'
    # サーバー上に存在しないユーザーは対象外（未作成のまま何もしない）
    - item.UserName in ansible_facts.getent_passwd

- name: ユーザーを無効化する（users_delete_mode=disable のとき）
  ansible.builtin.user:
    name: "{{ item.UserName }}"
    shell: "{{ users_nologin_shell }}"
    password_lock: true
    expires: 1
    state: present
  loop: "{{ users_disabled }}"
  loop_control:
    label: "{{ item.UserName }}"
  when:
    - users_delete_mode == 'disable'
    - item.UserName in ansible_facts.getent_passwd
